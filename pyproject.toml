[tool.poetry]
package-mode = false
[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.1"
uvicorn = {extras = ["standart"], version = "^0.46.0"}
pydantic = {extras = ["email"], version = "^2.13.3"}
pydantic-settings = "^2.14.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.49"}
asyncpg = "^0.31.0"
alembic = "^1.18.4"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}
bcrypt = "^5.0.0"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["task-tracker"]
asyncio_mode = "auto"